[project]
license = { text = "MIT" }
name = "hifi-backtest-tv"
version = "0.2.0"
description = "High-fidelity backtest toolkit: auto-fetch clean data and validate TradingView (Pine) results; MT5 parity optional"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy", "matplotlib", "pyyaml"]
[project.optional-dependencies]
dev = ["pytest"]
stocks = ["yfinance"]
exchanges = ["ccxt"]
[project.scripts]
hifi = "hifi.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["hifi*"]
